StylesPath = styles
MinAlertLevel = suggestion
Vocab = Docs

Packages = Microsoft, write-good

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, write-good, Custom

# Personal blog/portfolio, not corporate docs — these Microsoft rules are too
# strict or not applicable here.
Microsoft.Contractions = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO

# write-good.E-Prime bans every form of "to be" (is/are/was/be...), which
# is an extreme experimental writing constraint, not a normal style check —
# it alone accounts for more hits than every other rule combined.
write-good.E-Prime = NO

# Microsoft.Passive duplicates write-good.Passive (same sentences, two
# alerts); keep write-good's wording only.
Microsoft.Passive = NO

# Adding a capitalized word to the project vocabulary (below) makes Vale
# auto-enforce that exact casing everywhere via Vale.Terms — not what the
# vocabulary is for here; it's just to stop false-positive spelling hits.
Vale.Terms = NO

# Spaced em dashes (word — word) are a deliberate, valid style choice, not
# an error.
Microsoft.Dashes = NO

# Microsoft's own exceptions list has "URLs" (plural) but not "URL"
# (singular) — an upstream gap. Custom.Headings (styles/Custom/Headings.yml)
# is a local copy of the same rule with "URL" added; use that instead.
Microsoft.Headings = NO
